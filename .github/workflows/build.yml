name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          [
            ubuntu-22.04,
            ubuntu-24.04,
            ubuntu-22.04-arm,
            ubuntu-24.04-arm,
            windows-2025,
            windows-2022,
            macos-26,
            macos-15,
          ]
        toolchain: [stable]
        include:
          - os: ubuntu-24.04
            toolchain: beta
          - os: ubuntu-24.04
            toolchain: nightly
          - os: ubuntu-24.04
            toolchain: "1.85" # MSRV, keep in sync with rust-version in Cargo.toml
    steps:
      - name: Install ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --examples --verbose
        continue-on-error: ${{ matrix.toolchain == 'beta' || matrix.toolchain == 'nightly' }}

  clippy:
    name: clippy (ubuntu-latest, stable)
    runs-on: ubuntu-latest
    steps:
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Checkout sources
        uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Cargo Clippy
        run: cargo clippy --all-targets -- -D warnings -A deprecated

  fmt:
    name: fmt (ubuntu-latest, stable)
    runs-on: ubuntu-latest
    steps:
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Checkout sources
        uses: actions/checkout@v5
      - name: Check Formatting
        run: cargo fmt --all -- --check
